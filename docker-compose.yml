services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      AIVEN_DB_HOST: mysql
      AIVEN_DB_PORT: 3306
      AIVEN_DB_NAME: water_station
      AIVEN_DB_USER: root
      AIVEN_DB_PASSWORD: rootpassword
      JWT_SECRET: dev-secret-key
      PAYMONGO_SECRET_KEY: test-key
    depends_on:
      - mysql
    volumes:
      - .:/app
      - /app/node_modules

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: water_station
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
