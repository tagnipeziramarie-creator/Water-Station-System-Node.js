<!DOCTYPE html>
<html lang="en">
<head>

<!-- =========================================================
     META / PAGE SETTINGS
========================================================= -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Page Title -->
<title>Admin Dashboard - Water Station</title>

<style>

/* =========================================================
   ROOT VARIABLES / GLOBAL COLORS
========================================================= */
:root {
  --primary:#0ea5e9;
  --primary-dark:#0369a1;
  --secondary:#14b8a6;
  --dark:#0f172a;
  --muted:#64748b;
  --light:#f8fafc;
  --border:#e2e8f0;
  --success:#16a34a;
  --warning:#f59e0b;
  --danger:#dc2626;
  --shadow-sm:0 4px 14px rgba(15,23,42,.08);
  --shadow-md:0 12px 30px rgba(15,23,42,.12);
  --radius:18px;
}

/* =========================================================
   GLOBAL RESET
========================================================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box
}

/* =========================================================
   BODY / MAIN BACKGROUND
========================================================= */
body{
  font-family:"Segoe UI",Tahoma,Verdana,sans-serif;
  background:
  radial-gradient(circle at top left,rgba(14,165,233,.18),transparent 32%),
  radial-gradient(circle at top right,rgba(20,184,166,.16),transparent 32%),
  #f8fafc;

  color:var(--dark);
  min-height:100vh
}

/* =========================================================
   MAIN LAYOUT GRID
========================================================= */
.layout{
  display:grid;
  grid-template-columns:270px 1fr;
  min-height:100vh
}

/* =========================================================
   SIDEBAR SECTION
========================================================= */
.sidebar{
  background:#0f172a;
  color:white;
  padding:24px 18px;
  position:sticky;
  top:0;
  height:100vh
}

/* =========================================================
   BRAND / LOGO AREA
========================================================= */
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:28px;
  padding:0 8px
}

.brand-icon{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  font-size:23px
}

.brand h2{
  font-size:18px
}

.brand p{
  color:#94a3b8;
  font-size:12px
}

/* =========================================================
   SIDEBAR NAVIGATION BUTTONS
========================================================= */
.nav-menu{
  display:grid;
  gap:8px
}

.nav-menu button{
  color:#cbd5e1;
  background:none;
  border:none;
  text-align:left;
  padding:12px 14px;
  border-radius:14px;
  font-weight:700;
  font-size:14px;
  cursor:pointer
}

/* Active & Hover Effect */
.nav-menu button:hover,
.nav-menu button.active{
  background:rgba(14,165,233,.16);
  color:white
}

/* =========================================================
   SIDEBAR FOOTER / LOGOUT
========================================================= */
.sidebar-footer{
  position:absolute;
  left:18px;
  right:18px;
  bottom:22px
}

/* Logout Button */
.logout-btn{
  width:100%;
  background:rgba(220,38,38,.12);
  color:#fecaca;
  border:1px solid rgba(248,113,113,.35);
  padding:12px 18px;
  border-radius:14px;
  cursor:pointer;
  font-weight:800
}

.logout-btn:hover{
  background:var(--danger);
  color:white
}

/* =========================================================
   MAIN CONTENT AREA
========================================================= */
.main{
  padding:26px;
  overflow-x:hidden
}

/* =========================================================
   TOP HEADER / TOPBAR
========================================================= */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,.9);
  border:1px solid var(--border);
  border-radius:24px;
  padding:22px 26px;
  box-shadow:var(--shadow-sm);
  margin-bottom:24px
}

.topbar h1{
  font-size:28px;
  color:#082f49
}

.topbar p{
  color:var(--muted);
  font-size:14px;
  margin-top:4px
}

/* =========================================================
   GLOBAL BUTTON STYLES
========================================================= */
.refresh-btn,
.save-btn,
.assign-btn,
.cancel-btn{
  border:none;
  border-radius:999px;
  font-weight:900;
  cursor:pointer
}

/* Refresh Dashboard Button */
.refresh-btn{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:white;
  padding:12px 18px
}

/* =========================================================
   LAST UPDATED TEXT
========================================================= */
.last-updated{
  font-size:12px;
  color:var(--muted);
  text-align:right;
  margin-top:6px
}

/* =========================================================
   PAGE VISIBILITY SYSTEM
========================================================= */
.page{
  display:none
}

.page.active{
  display:block
}

/* =========================================================
   DASHBOARD STATISTICS GRID
========================================================= */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(160px,1fr));
  gap:18px;
  margin-bottom:24px
}

/* Statistic Cards */
.stat-card{
  background:white;
  padding:20px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
  position:relative;
  overflow:hidden
}

/* Colored top line */
.stat-card::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:4px;
  background:linear-gradient(90deg,var(--primary),var(--secondary))
}

/* Icon */
.stat-icon{
  font-size:26px;
  margin-bottom:10px
}

/* Label */
.stat-label{
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  font-weight:900
}

/* Number */
.stat-number{
  font-size:30px;
  font-weight:900;
  color:#082f49;
  margin-top:6px
}

/* =========================================================
   GENERIC SECTION CARD
========================================================= */
.section{
  background:white;
  padding:24px;
  border-radius:24px;
  border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
  margin-bottom:24px
}

/* Section Header */
.section-header{
  margin-bottom:18px;
  border-bottom:1px solid var(--border);
  padding-bottom:14px
}

.section h2{
  font-size:20px;
  color:#082f49
}

.section-desc{
  color:var(--muted);
  font-size:14px;
  margin-top:4px
}

/* =========================================================
   2 COLUMN GRID LAYOUT
========================================================= */
.grid-2{
  display:grid;
  grid-template-columns:repeat(2,minmax(280px,1fr));
  gap:20px
}

/* =========================================================
   CHART BOXES
========================================================= */
.chart-box{
  background:var(--light);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px
}

.chart-title{
  font-weight:900;
  margin-bottom:12px
}

.chart-container{
  height:300px
}

/* =========================================================
   TABLE STYLES
========================================================= */
.table-wrap{
  width:100%;
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:16px
}

.table{
  width:100%;
  border-collapse:collapse;
  min-width:760px
}

/* Table Headers */
.table th{
  background:#f1f5f9;
  padding:13px 14px;
  text-align:left;
  color:#334155;
  font-weight:900;
  font-size:13px
}

/* Table Cells */
.table td{
  padding:13px 14px;
  border-top:1px solid var(--border);
  font-size:14px
}

/* =========================================================
   STATUS BADGES
========================================================= */
.badge{
  display:inline-flex;
  padding:6px 11px;
  border-radius:999px;
  font-size:12px;
  font-weight:900
}

.badge-success{
  background:#dcfce7;
  color:#166534
}

.badge-warning{
  background:#fef3c7;
  color:#92400e
}

.badge-danger{
  background:#fee2e2;
  color:#991b1b
}

.badge-info{
  background:#e0f2fe;
  color:#075985
}

.badge-muted{
  background:#e2e8f0;
  color:#475569
}

/* =========================================================
   EMPTY / ERROR / NOTICE STATES
========================================================= */
.empty-card,
.empty-message{
  text-align:center;
  color:var(--muted);
  padding:28px
}

.empty-card{
  background:#f8fafc;
  border:1px dashed #cbd5e1;
  border-radius:18px
}

/* Error Message */
.error{
  background:#fee2e2;
  color:#991b1b;
  padding:14px 16px;
  border-radius:16px;
  margin-bottom:18px;
  border:1px solid #fecaca;
  font-weight:700
}

/* Notice Message */
.notice{
  background:#e0f2fe;
  color:#075985;
  padding:14px 16px;
  border-radius:16px;
  margin-bottom:18px;
  border:1px solid #bae6fd;
  font-weight:700
}

/* =========================================================
   INVENTORY SECTION
========================================================= */
.inventory-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
  gap:14px
}

/* Inventory Card */
.inventory-card{
  background:#f8fafc;
  padding:16px;
  border-radius:18px;
  border:1px solid var(--border)
}

/* Product Name */
.inventory-name{
  font-weight:900;
  color:#334155
}

/* Product Price */
.inventory-price{
  color:var(--muted);
  font-size:13px;
  margin-top:3px
}

/* Inventory Form */
.inventory-form{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  margin-top:14px
}

/* Quantity Input */
.inventory-form input{
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  font-size:15px
}

/* Save Inventory Button */
.save-btn{
  background:#dcfce7;
  color:#166534;
  padding:10px 14px
}

.save-btn:hover{
  background:var(--success);
  color:white
}

/* Assign Delivery Button */
.assign-btn{
  background:#e0f2fe;
  color:#075985;
  padding:8px 12px
}

.assign-btn:hover{
  background:var(--primary);
  color:white
}

/* Cancel Order Button */
.cancel-btn{
  background:#fee2e2;
  color:#991b1b;
  padding:8px 12px
}

.cancel-btn:hover{
  background:var(--danger);
  color:white
}

/* Delivery Staff Dropdown */
.select-staff{
  padding:9px;
  border-radius:12px;
  border:1px solid #cbd5e1
}

/* Low Stock State */
.stock-low{
  background:#fffbeb;
  border-color:#fde68a
}

/* Out of Stock State */
.stock-out{
  background:#fef2f2;
  border-color:#fecaca
}

/* =========================================================
   RESPONSIVE DESIGN
========================================================= */
@media(max-width:1100px){

  .layout{
    grid-template-columns:1fr
  }

  .sidebar{
    position:relative;
    height:auto
  }

  .sidebar-footer{
    position:static;
    margin-top:18px
  }

  .nav-menu{
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr))
  }

  .stats-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .grid-2{
    grid-template-columns:1fr
  }
}

@media(max-width:650px){

  .main{
    padding:16px
  }

  .topbar{
    flex-direction:column;
    align-items:stretch
  }

  .stats-grid{
    grid-template-columns:1fr
  }

  .section{
    padding:18px
  }
}

</style>
</head>

<body>

<!-- =========================================================
     MAIN LAYOUT CONTAINER
========================================================= -->
<div class="layout">

<!-- =========================================================
     SIDEBAR NAVIGATION
========================================================= -->
<aside class="sidebar">

  <!-- Brand / Logo -->
  <div class="brand">
    <div class="brand-icon">💧</div>

    <div>
      <h2>Water Station</h2>
      <p>Admin Dashboard</p>
    </div>
  </div>

  <!-- Navigation Buttons -->
  <div class="nav-menu">

    <button class="active" data-page="overviewPage">
      📊 Overview
    </button>

    <button data-page="ordersPage">
      📑 Orders
    </button>

    <button data-page="assignPage">
      📌 Assign Delivery
    </button>

    <button data-page="inventoryPage">
      📦 Inventory
    </button>

    <button data-page="customersPage">
      ⭐ Customers
    </button>

    <button data-page="deliveryPage">
      🚚 Delivery Staff
    </button>

  </div>

  <!-- Logout Area -->
  <div class="sidebar-footer">
    <button class="logout-btn" onclick="logout()">
      Logout
    </button>
  </div>

</aside>

<!-- =========================================================
     MAIN CONTENT AREA
========================================================= -->
<main class="main">

<!-- =========================================================
     TOP HEADER SECTION
========================================================= -->
<header class="topbar">

  <!-- Page Title -->
  <div>
    <h1 id="pageTitle">Overview</h1>

    <p id="pageSubtitle">
      System summary and real-time records.
    </p>
  </div>

  <!-- Refresh Button -->
  <div>

    <button
      class="refresh-btn"
      id="refreshBtn"
      onclick="loadDashboard()"
    >
      Refresh Data
    </button>

    <!-- Last Update Timestamp -->
    <div class="last-updated" id="lastUpdated">
      Not updated yet
    </div>

  </div>
</header>

<!-- Error Messages -->
<div id="errorContainer"></div>

<!-- Notice Messages -->
<div id="noticeContainer"></div>

<!-- =========================================================
     OVERVIEW PAGE
========================================================= -->
<section id="overviewPage" class="page active">

  <!-- Statistics Cards -->
  <div class="stats-grid">

    <div class="stat-card">
      <div class="stat-icon">👥</div>
      <div class="stat-label">Total Users</div>
      <div class="stat-number" id="totalUsers">0</div>
    </div>

  </div>

</section>

<!-- =========================================================
     JAVASCRIPT LIBRARY
========================================================= -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

/* Detect current API URL */
const API_URL =
window.location.origin &&
window.location.origin !== 'null'
? window.location.origin
: '';

/* Get stored login token */
const token = localStorage.getItem('token');

/* Chart Variables */
let ordersChart, deliveryChart;

/* =========================================================
   LOGIN VALIDATION
========================================================= */

/* Redirect user if no token exists */
if (!token)
window.location.href = '/index.html';

/* =========================================================
   SIDEBAR NAVIGATION SYSTEM
========================================================= */

/* Handle sidebar button clicks */
document.querySelectorAll('.nav-menu button')
.forEach(btn => {

  btn.addEventListener('click', () => {

    /* Remove active class from all buttons */
    document.querySelectorAll('.nav-menu button')
    .forEach(b => b.classList.remove('active'));

    /* Hide all pages */
    document.querySelectorAll('.page')
    .forEach(p => p.classList.remove('active'));

    /* Activate selected button */
    btn.classList.add('active');

    /* Show selected page */
    document
    .getElementById(btn.dataset.page)
    .classList.add('active');

    /* Update page title */
    document.getElementById('pageTitle')
    .textContent =
    btn.textContent.replace(/[^\w\s]/g, '').trim();

  });

});

/* =========================================================
   LOAD DASHBOARD DATA
========================================================= */

async function loadDashboard(){

  /* Disable refresh button while loading */
  setRefreshing(true);

  /* Clear messages */
  clearError();
  clearNotice();

  try{

    /* Fetch dashboard data */
    const dashboardRes = await fetch(
      `${API_URL}/dashboard/admin`,
      {
        headers:{
          Authorization:`Bearer ${token}`
        }
      }
    );

    /* Convert response to JSON */
    const dashboardBody =
    await dashboardRes.json().catch(()=>({}));

    /* Check for errors */
    if(!dashboardRes.ok)
      throw new Error(
        dashboardBody.error ||
        dashboardBody.message ||
        'Failed to load dashboard'
      );

    /* Get order data */
    const orders = await getAdminOrders();

    /* Display dashboard */
    displayDashboard(
      dashboardBody.data || {},
      orders
    );

    /* Update timestamp */
    updateLastUpdated();

  }catch(e){

    /* Show error */
    displayError(
      e.message || 'Dashboard loading failed'
    );

  }finally{

    /* Enable refresh button */
    setRefreshing(false);

  }

}

/* =========================================================
   LOGOUT FUNCTION
========================================================= */

function logout(){

  /* Remove saved login info */
  localStorage.removeItem('token');
  localStorage.removeItem('user');

  /* Redirect to login page */
  window.location.href='/index.html';

}

/* =========================================================
   AUTO LOAD DASHBOARD
========================================================= */

/* Load dashboard once page opens */
loadDashboard();

/* Auto refresh every 30 seconds */
setInterval(loadDashboard,30000);

</script>

</body>
</html>
