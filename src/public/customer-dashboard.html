<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - Water Station</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-name {
            text-align: right;
        }

        .user-name p {
            color: #666;
            font-size: 14px;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
        }

        .orders-table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            color: #333;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }

        .orders-table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .orders-table tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-confirmed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-in-transit {
            background: #cce5ff;
            color: #004085;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .product-quantity {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .order-btn {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .order-btn:hover {
            background: #764ba2;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 30px;
            font-size: 16px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🚚 Customer Dashboard</h1>
            </div>
            <div class="user-info">
                <div class="user-name">
                    <strong id="customerName">Loading...</strong>
                    <p id="customerEmail">Email</p>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="errorContainer"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <div style="font-size: 30px;">📦</div>
                <div class="stat-label">Total Orders</div>
                <div class="stat-number" id="totalOrders">0</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 30px;">⏳</div>
                <div class="stat-label">Pending Orders</div>
                <div class="stat-number" id="pendingOrders">0</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 30px;">✅</div>
                <div class="stat-label">Completed Orders</div>
                <div class="stat-number" id="completedOrders">0</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 30px;">💰</div>
                <div class="stat-label">Total Spent</div>
                <div class="stat-number" id="totalSpent">₱0.00</div>
            </div>
        </div>

        <div class="section">
            <h2>🚀 Active Orders</h2>
            <div id="activeOrdersContainer" class="loading">Loading active orders...</div>
        </div>

        <div class="section">
            <h2>📋 Recent Orders</h2>
            <div id="recentOrdersContainer" class="loading">Loading recent orders...</div>
        </div>

        <div class="section">
            <h2>💧 Available Products</h2>
            <div id="productsContainer" class="loading">Loading available products...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = '/login.html';
        }

        // Fetch dashboard data
        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}/dashboard/customer`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load dashboard');
                }

                const data = await response.json();
                displayDashboard(data.data);
            } catch (error) {
                displayError(error.message);
                console.error('Error:', error);
            }
        }

        function displayDashboard(data) {
            // Display customer info
            document.getElementById('customerName').textContent = data.customer.name;
            document.getElementById('customerEmail').textContent = data.customer.email;

            // Display statistics
            document.getElementById('totalOrders').textContent = data.statistics.totalOrders;
            document.getElementById('pendingOrders').textContent = data.statistics.pendingOrders;
            document.getElementById('completedOrders').textContent = data.statistics.completedOrders;
            document.getElementById('totalSpent').textContent = `₱${parseFloat(data.statistics.totalSpent).toFixed(2)}`;

            // Display active orders
            displayActiveOrders(data.activeOrders);

            // Display recent orders
            displayRecentOrders(data.recentOrders);

            // Display available products
            displayProducts(data.availableProducts);
        }

        function displayActiveOrders(orders) {
            const container = document.getElementById('activeOrdersContainer');
            
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty-message">No active orders at the moment</div>';
                return;
            }

            let html = '<table class="orders-table"><thead><tr><th>Order ID</th><th>Items</th><th>Total</th><th>Status</th><th>Delivery Personnel</th></tr></thead><tbody>';
            
            orders.forEach(order => {
                const status = getStatusBadge(order.status);
                const deliveryPersonnel = order.delivery?.delivery_personnel?.name || 'N/A';
                html += `<tr>
                    <td>#${order.id}</td>
                    <td>${order.total_items || 1} item(s)</td>
                    <td>₱${parseFloat(order.total_amount).toFixed(2)}</td>
                    <td>${status}</td>
                    <td>${deliveryPersonnel}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function displayRecentOrders(orders) {
            const container = document.getElementById('recentOrdersContainer');
            
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty-message">No recent orders</div>';
                return;
            }

            let html = '<table class="orders-table"><thead><tr><th>Order ID</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody>';
            
            orders.forEach(order => {
                const date = new Date(order.createdAt).toLocaleDateString();
                const status = getStatusBadge(order.status);
                html += `<tr>
                    <td>#${order.id}</td>
                    <td>${date}</td>
                    <td>₱${parseFloat(order.total_amount).toFixed(2)}</td>
                    <td>${status}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function displayProducts(products) {
            const container = document.getElementById('productsContainer');
            
            if (products.length === 0) {
                container.innerHTML = '<div class="empty-message">No products available</div>';
                return;
            }

            let html = '<div class="products-grid">';
            
            products.forEach(product => {
                html += `<div class="product-card">
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">₱${parseFloat(product.price).toFixed(2)}</div>
                    <div class="product-quantity">In Stock: ${product.quantity}</div>
                    <button class="order-btn" onclick="orderProduct(${product.id})">Order Now</button>
                </div>`;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        function getStatusBadge(status) {
            const badges = {
                'pending': '<span class="status-badge status-pending">Pending</span>',
                'confirmed': '<span class="status-badge status-confirmed">Confirmed</span>',
                'in_transit': '<span class="status-badge status-in-transit">In Transit</span>',
                'completed': '<span class="status-badge status-completed">Completed</span>'
            };
            return badges[status] || `<span class="status-badge">${status}</span>`;
        }

        function displayError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<div class="error">⚠️ ${message}</div>`;
        }

        function orderProduct(productId) {
            alert(`Order functionality will be implemented. Product ID: ${productId}`);
            // Redirect to order page or open order modal
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        // Load dashboard on page load
        loadDashboard();
    </script>
</body>
</html>
