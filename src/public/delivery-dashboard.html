<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Dashboard - Water Station</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-name {
            text-align: right;
        }

        .user-name p {
            color: #666;
            font-size: 14px;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #f5576c;
            margin: 10px 0;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 3px solid #f5576c;
            padding-bottom: 10px;
        }

        .delivery-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #f5576c;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .delivery-card:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .delivery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .delivery-id {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-in-transit {
            background: #cce5ff;
            color: #004085;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .customer-info {
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 14px;
        }

        .customer-info-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .customer-info-label {
            font-weight: 600;
            color: #666;
        }

        .customer-info-value {
            color: #333;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #f5576c;
            color: white;
        }

        .btn-primary:hover {
            background: #f03a5a;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 30px;
            font-size: 16px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #f5576c;
            font-size: 18px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .modal h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 600;
        }

        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-confirm {
            background: #28a745;
            color: white;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🚗 Delivery Dashboard</h1>
            </div>
            <div class="user-info">
                <div class="user-name">
                    <strong id="deliveryName">Loading...</strong>
                    <p id="deliveryEmail">Email</p>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="errorContainer"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <div style="font-size: 30px;">📦</div>
                <div class="stat-label">Total Deliveries</div>
                <div class="stat-number" id="totalDeliveries">0</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 30px;">✅</div>
                <div class="stat-label">Completed</div>
                <div class="stat-number" id="completedDeliveries">0</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 30px;">⏳</div>
                <div class="stat-label">Pending</div>
                <div class="stat-number" id="pendingDeliveries">0</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 30px;">🚚</div>
                <div class="stat-label">In Transit</div>
                <div class="stat-number" id="inTransitDeliveries">0</div>
            </div>
        </div>

        <div class="section">
            <h2>🎯 Active Deliveries</h2>
            <div id="activeDeliveriesContainer" class="loading">Loading active deliveries...</div>
        </div>

        <div class="section">
            <h2>📅 Today's Deliveries</h2>
            <div id="todayDeliveriesContainer" class="loading">Loading today's deliveries...</div>
        </div>
    </div>

    <!-- Status Update Modal -->
    <div class="modal" id="statusModal">
        <div class="modal-content">
            <h3>Update Delivery Status</h3>
            <form id="statusForm">
                <div class="form-group">
                    <label for="newStatus">New Status:</label>
                    <select id="newStatus" required>
                        <option value="">Select Status</option>
                        <option value="pending">Pending</option>
                        <option value="in_transit">In Transit</option>
                        <option value="completed">Completed</option>
                        <option value="failed">Failed</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="modal-buttons button btn-cancel" onclick="closeStatusModal()">Cancel</button>
                    <button type="submit" class="modal-buttons button btn-confirm">Update</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        const token = localStorage.getItem('token');
        let currentDeliveryId = null;

        if (!token) {
            window.location.href = '/login.html';
        }

        // Fetch dashboard data
        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}/dashboard/delivery`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load dashboard');
                }

                const data = await response.json();
                displayDashboard(data.data);
            } catch (error) {
                displayError(error.message);
                console.error('Error:', error);
            }
        }

        function displayDashboard(data) {
            // Display delivery personnel info
            document.getElementById('deliveryName').textContent = data.deliveryPersonnel.name;
            document.getElementById('deliveryEmail').textContent = data.deliveryPersonnel.email;

            // Display statistics
            document.getElementById('totalDeliveries').textContent = data.statistics.totalDeliveries;
            document.getElementById('completedDeliveries').textContent = data.statistics.completedDeliveries;
            document.getElementById('pendingDeliveries').textContent = data.statistics.pendingDeliveries;
            document.getElementById('inTransitDeliveries').textContent = data.statistics.inTransitDeliveries;

            // Display active deliveries
            displayActiveDeliveries(data.activeDeliveries);

            // Display today's deliveries
            displayTodayDeliveries(data.todayDeliveries);
        }

        function displayActiveDeliveries(deliveries) {
            const container = document.getElementById('activeDeliveriesContainer');
            
            if (deliveries.length === 0) {
                container.innerHTML = '<div class="empty-message">No active deliveries</div>';
                return;
            }

            let html = '';
            
            deliveries.forEach(delivery => {
                const order = delivery.delivery?.order;
                const customer = order?.customer;
                const status = getStatusBadge(delivery.status);
                
                html += `<div class="delivery-card">
                    <div class="delivery-header">
                        <div>
                            <div class="delivery-id">Delivery #${delivery.id}</div>
                            <div style="color: #999; font-size: 12px;">Order #${order?.id}</div>
                        </div>
                        ${status}
                    </div>
                    <div class="customer-info">
                        <div class="customer-info-row">
                            <span class="customer-info-label">Customer:</span>
                            <span class="customer-info-value">${customer?.name || 'N/A'}</span>
                        </div>
                        <div class="customer-info-row">
                            <span class="customer-info-label">Phone:</span>
                            <span class="customer-info-value">${customer?.phone || 'N/A'}</span>
                        </div>
                        <div class="customer-info-row">
                            <span class="customer-info-label">Address:</span>
                            <span class="customer-info-value">${customer?.address || 'N/A'}</span>
                        </div>
                        <div class="customer-info-row">
                            <span class="customer-info-label">Barangay:</span>
                            <span class="customer-info-value">${customer?.barangay || 'N/A'}</span>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="openStatusModal(${delivery.id})">Update Status</button>
                        <button class="btn btn-success" onclick="markComplete(${delivery.id})">Mark Complete</button>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function displayTodayDeliveries(deliveries) {
            const container = document.getElementById('todayDeliveriesContainer');
            
            if (deliveries.length === 0) {
                container.innerHTML = '<div class="empty-message">No deliveries today</div>';
                return;
            }

            let html = '';
            
            deliveries.forEach(delivery => {
                const order = delivery.delivery?.order;
                const customer = order?.customer;
                const status = getStatusBadge(delivery.status);
                
                html += `<div class="delivery-card">
                    <div class="delivery-header">
                        <div>
                            <div class="delivery-id">Delivery #${delivery.id}</div>
                            <div style="color: #999; font-size: 12px;">Order #${order?.id}</div>
                        </div>
                        ${status}
                    </div>
                    <div class="customer-info">
                        <div class="customer-info-row">
                            <span class="customer-info-label">Customer:</span>
                            <span class="customer-info-value">${customer?.name || 'N/A'}</span>
                        </div>
                        <div class="customer-info-row">
                            <span class="customer-info-label">Address:</span>
                            <span class="customer-info-value">${customer?.address || 'N/A'}</span>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="openStatusModal(${delivery.id})">Update Status</button>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function getStatusBadge(status) {
            const badges = {
                'pending': '<span class="status-badge status-pending">Pending</span>',
                'in_transit': '<span class="status-badge status-in-transit">In Transit</span>',
                'completed': '<span class="status-badge status-completed">Completed</span>'
            };
            return badges[status] || `<span class="status-badge">${status}</span>`;
        }

        function displayError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<div class="error">⚠️ ${message}</div>`;
        }

        function openStatusModal(deliveryId) {
            currentDeliveryId = deliveryId;
            document.getElementById('statusModal').classList.add('show');
        }

        function closeStatusModal() {
            document.getElementById('statusModal').classList.remove('show');
            currentDeliveryId = null;
        }

        async function markComplete(deliveryId) {
            await updateDeliveryStatus(deliveryId, 'completed');
        }

        document.getElementById('statusForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newStatus = document.getElementById('newStatus').value;
            await updateDeliveryStatus(currentDeliveryId, newStatus);
        });

        async function updateDeliveryStatus(deliveryId, status) {
            try {
                const response = await fetch(`${API_URL}/dashboard/delivery/${deliveryId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status })
                });

                if (!response.ok) {
                    throw new Error('Failed to update delivery status');
                }

                closeStatusModal();
                alert('Delivery status updated successfully!');
                loadDashboard(); // Reload dashboard
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        // Load dashboard on page load
        loadDashboard();
    </script>
</body>
</html>
