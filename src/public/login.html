<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Water Station</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5a67d8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .show-btn {
      background: none;
      color: #667eea;
      border: none;
      padding: 0;
      margin: 0 0 12px 0;
      width: auto;
      display: block;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .show-btn:hover {
      background: none;
      color: #5a67d8;
    }

    .error {
      color: red;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .success {
      color: green;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Water Station</h2>
  <p>Login</p>

  <p id="message"></p>

  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />

    <button type="button" class="show-btn" id="showPasswordBtn">
      Show Password
    </button>

    <button type="submit" id="loginBtn">Login</button>
  </form>

  <p>Don't have account? <a href="/register.html">Register</a></p>
</div>

<script>
  const form = document.getElementById('loginForm');
  const message = document.getElementById('message');
  const loginBtn = document.getElementById('loginBtn');
  const showPasswordBtn = document.getElementById('showPasswordBtn');
  const passwordInput = document.getElementById('password');

  showPasswordBtn.addEventListener('click', function () {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      showPasswordBtn.innerText = 'Hide Password';
    } else {
      passwordInput.type = 'password';
      showPasswordBtn.innerText = 'Show Password';
    }
  });

  function redirect(role) {
    if (role === 'admin') {
      window.location.href = '/admin-dashboard.html';
    } else if (role === 'delivery') {
      window.location.href = '/delivery-dashboard.html';
    } else {
      window.location.href = '/customer-dashboard.html';
    }
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = passwordInput.value.trim();

    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in...';

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        message.className = 'error';
        message.innerText = data.error || 'Login failed';
        return;
      }

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));

      message.className = 'success';
      message.innerText = 'Login successful! Redirecting...';

      redirect(data.user.role);

    } catch (err) {
      message.className = 'error';
      message.innerText = 'Server error. Make sure node src/server.js is running.';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Login';
    }
  });
</script>

</body>
</html>
