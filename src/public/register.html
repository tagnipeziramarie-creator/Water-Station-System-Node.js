<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Register - Pure Water Station</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      color: #333;
    }

    .register-backdrop {
      position: fixed;
      inset: 0;
      background: linear-gradient(145deg, rgba(102, 126, 234, 0.92) 0%, rgba(118, 75, 162, 0.92) 100%);
      backdrop-filter: blur(6px);
      z-index: 0;
    }

    .register-shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      padding-top: max(24px, env(safe-area-inset-top));
    }

    .register-topbar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 10px;
    }

    @media (max-width: 360px) {
      .register-topbar {
        justify-content: center;
        text-align: center;
      }

      .register-brand {
        order: -1;
        width: 100%;
        justify-content: center;
      }
    }

    .register-topbar a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      opacity: 0.95;
    }

    .register-topbar a:hover {
      text-decoration: underline;
    }

    .register-brand {
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .register-popup {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.28);
      padding: clamp(20px, 4vw, 32px);
      max-height: min(90vh, 720px);
      max-height: min(90dvh, 720px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 1;
    }

    .register-popup h2 {
      text-align: center;
      margin-bottom: 6px;
      font-size: clamp(1.25rem, 4vw, 1.5rem);
      color: #222;
    }

    .register-popup .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 18px;
      line-height: 1.45;
    }

    .register-popup label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
      margin-top: 10px;
      text-align: left;
    }

    .register-popup label:first-of-type {
      margin-top: 0;
    }

    .register-popup input,
    .register-popup select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      background: #fff;
    }

    .register-popup input:focus,
    .register-popup select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    .field-note {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
      line-height: 1.35;
    }

    .toggle-password-btn {
      display: block;
      margin-top: 8px;
      margin-bottom: 4px;
      padding: 0;
      border: none;
      background: none;
      color: #667eea;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
    }

    .toggle-password-btn:hover {
      text-decoration: underline;
    }

    .btn-primary-full {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary-full:hover {
      opacity: 0.95;
    }

    .btn-primary-full:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-secondary-full {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #f1f3f5;
      color: #495057;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-secondary-full:hover {
      background: #e9ecef;
    }

    #message {
      margin-top: 14px;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
      min-height: 22px;
    }

    #message.success {
      color: #198754;
    }

    #message.error {
      color: #c0392b;
    }

    .login-link {
      margin-top: 18px;
      font-size: 14px;
      text-align: center;
      color: #555;
    }

    .login-link a {
      color: #667eea;
      font-weight: 700;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 380px) {
      .register-popup {
        border-radius: 12px;
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="register-backdrop" aria-hidden="true"></div>

  <div class="register-shell">
    <div class="register-topbar">
      <a href="/index.html">← Home</a>
      <span class="register-brand"><span aria-hidden="true">💧</span> Pure Water</span>
      <a href="/login.html">Login</a>
    </div>

    <main class="register-popup" role="dialog" aria-labelledby="regTitle">
      <h2 id="regTitle">Create account</h2>
      <p class="subtitle">Customer registration — order refills and track deliveries.</p>

      <form id="registerForm">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Full name" required autocomplete="name" />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email" required autocomplete="email" />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password" />

        <button type="button" class="toggle-password-btn" id="toggleRegPasswordBtn">Show password</button>

        <label for="phone">Phone number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Example: 09123456789"
          required
          maxlength="11"
          minlength="11"
          pattern="[0-9]{11}"
          inputmode="numeric"
          autocomplete="tel"
        />
        <p class="field-note">Phone number must be exactly 11 digits.</p>

        <label for="address">Street / Sitio / Purok</label>
        <input type="text" id="address" name="address" placeholder="Street / Sitio / Purok" required autocomplete="street-address" />

        <label for="barangay">Barangay</label>
        <select id="barangay" name="barangay" required>
          <option value="">Select barangay in Hinunangan</option>
          <option value="Ambacon">Ambacon</option>
          <option value="Badiangon">Badiangon</option>
          <option value="Bangcas A">Bangcas A</option>
          <option value="Bangcas B">Bangcas B</option>
          <option value="Biasong">Biasong</option>
          <option value="Bugho">Bugho</option>
          <option value="Calag-itan">Calag-itan</option>
          <option value="Calayugan">Calayugan</option>
          <option value="Calinao">Calinao</option>
          <option value="Canipaan">Canipaan</option>
          <option value="Catublian">Catublian</option>
          <option value="Ilaya">Ilaya</option>
          <option value="Ingan">Ingan</option>
          <option value="Labrador">Labrador</option>
          <option value="Libas">Libas</option>
          <option value="Lumbog">Lumbog</option>
          <option value="Manalog">Manalog</option>
          <option value="Manlico">Manlico</option>
          <option value="Matin-ao">Matin-ao</option>
          <option value="Nava">Nava</option>
          <option value="Nueva Esperanza">Nueva Esperanza</option>
          <option value="Otama">Otama</option>
          <option value="Palongpong">Palongpong</option>
          <option value="Panalaron">Panalaron</option>
          <option value="Patong">Patong</option>
          <option value="Poblacion">Poblacion</option>
          <option value="Pondol">Pondol</option>
          <option value="Salog">Salog</option>
          <option value="Salvacion">Salvacion</option>
          <option value="San Pablo Island">San Pablo Island</option>
          <option value="San Pedro Island">San Pedro Island</option>
          <option value="Santo Niño I">Santo Niño I</option>
          <option value="Santo Niño II">Santo Niño II</option>
          <option value="Tahusan">Tahusan</option>
          <option value="Talisay">Talisay</option>
          <option value="Tawog">Tawog</option>
          <option value="Toptop">Toptop</option>
          <option value="Tuburan">Tuburan</option>
          <option value="Union">Union</option>
          <option value="Upper Bantawon">Upper Bantawon</option>
        </select>

        <button type="submit" class="btn-primary-full" id="registerBtn">Register</button>
        <button type="button" class="btn-secondary-full" id="backToHomeBtn">Back to home</button>
      </form>

      <p id="message" aria-live="polite"></p>

      <div class="login-link">
        Already registered? <a href="/login.html">Sign in</a> · <a href="/customer-dashboard.html">Customer dashboard</a>
      </div>
    </main>
  </div>

  <script>
    const API_URL = window.location.origin && window.location.origin !== 'null' ? window.location.origin : '';

    const form = document.getElementById('registerForm');
    const message = document.getElementById('message');
    const registerBtn = document.getElementById('registerBtn');
    const phoneInput = document.getElementById('phone');

    // Allow numbers only in phone input
    phoneInput.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '').slice(0, 11);
    });

    // Show or hide password
    document.getElementById('toggleRegPasswordBtn').addEventListener('click', function () {
      const passwordInput = document.getElementById('password');
      const btn = document.getElementById('toggleRegPasswordBtn');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        btn.textContent = 'Hide password';
      } else {
        passwordInput.type = 'password';
        btn.textContent = 'Show password';
      }
    });

    // Back to homepage
    document.getElementById('backToHomeBtn').addEventListener('click', function () {
      window.location.href = '/index.html';
    });

    // Register form submit
    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const phone = document.getElementById('phone').value.trim();

      // Validate phone number before sending to backend
      if (!/^\d{11}$/.test(phone)) {
        message.className = 'error';
        message.textContent = 'Phone number must be exactly 11 digits.';
        phoneInput.focus();
        return;
      }

      const data = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value.trim(),
        phone: phone,
        address: document.getElementById('address').value.trim(),
        barangay: document.getElementById('barangay').value.trim(),
      };

      registerBtn.disabled = true;
      registerBtn.textContent = 'Registering…';
      message.textContent = '';
      message.className = '';

      try {
        const res = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        const result = await res.json().catch(function () {
          return {};
        });

        if (res.ok) {
          message.className = 'success';
          message.textContent = result.message || 'Registered! Redirecting…';

          form.reset();

          if (result.token) {
            localStorage.setItem('token', result.token);
            localStorage.setItem('user', JSON.stringify(result.user || {}));
          }

          setTimeout(function () {
            window.location.href = '/customer-dashboard.html';
          }, 900);
        } else {
          message.className = 'error';

          var errMsg = result.error;

          if (!errMsg && result.errors && result.errors.length) {
            errMsg = result.errors[0].msg || result.errors[0].message;
          }

          message.textContent = errMsg || 'Registration failed';
        }
      } catch (err) {
        message.className = 'error';
        message.textContent = 'Could not reach the server.';
      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = 'Register';
      }
    });
  </script>
</body>
</html>
